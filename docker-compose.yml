services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: praxrag-postgres
    environment:
      POSTGRES_DB: praxrag
      POSTGRES_USER: praxrag
      POSTGRES_PASSWORD: praxrag
    ports:
      - "5433:5432"
    volumes:
      - praxrag_pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxrag -d praxrag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  praxrag_pgdata:
